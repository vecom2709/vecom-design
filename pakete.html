<!DOCTYPE html>
<html lang="it" data-title-key="det.title">
<head>

<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>

<body>
<div class="grain" aria-hidden="true"></div>

<header class="header is-stuck">
  <div class="wrap header__inner">
    <a class="brand" href="index.html" aria-label="Vecom Design">
      <img src="assets/img/logo-mark.webp" alt="" width="420" height="330">
      <span class="brand__name">Vecom<span>Design</span></span>
    </a>
    <div class="header__tools">
      <div class="lang" role="group" aria-label="Lingua / Sprache / Language">
        <button type="button" data-lang="it" aria-pressed="true">IT</button>
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <a class="btn" href="index.html#plans" data-i18n="det.back">Torna ai prezzi</a>
    </div>
  </div>
</header>

<main class="wrap legal det-page">
  <h1 data-i18n="det.head">I pacchetti in dettaglio</h1>
  <p class="legal__lead" data-i18n="det.lead"></p>

  <nav class="legal__nav" aria-label="Pacchetti">
    <a href="#starter" data-i18n="plans.n1">Starter</a>
    <a href="#business" data-i18n="plans.n2">Business</a>
    <a href="#premium" data-i18n="plans.n3">Premium</a>
  </nav>

  <section class="det" id="starter">
    <div class="det__head">
      <span class="det__no">01</span>
      <div>
        <h2 data-i18n="plans.n1"></h2>
        <p class="det__sub" data-i18n="plans.s1"></p>
      </div>
      <p class="det__price"><span data-i18n="plans.p1"></span><small data-i18n="plans.priceNote"></small></p>
    </div>
    <p class="det__lead" data-i18n="det.l1"></p>

    <div class="det__grid">
      <div class="det__col">
        <h3 data-i18n="det.forWho"></h3>
        <p data-i18n="det.w1"></p>
        <h3 data-i18n="det.care"></h3>
        <p data-i18n="det.c1"></p>
      </div>
      <div class="det__col">
        <h3 data-i18n="det.inc"></h3>
        <ul class="det__list det__list--yes" data-i18n-list="plans.f1"></ul>
      </div>
      <div class="det__col">
        <h3 data-i18n="det.notInc"></h3>
        <ul class="det__list det__list--no" data-i18n-list="det.n1"></ul>
        <p class="det__ideal" data-i18n="plans.i1"></p>
      </div>
    </div>

    <div class="det__dauer"><h3 data-i18n="det.dauer"></h3><p data-i18n="det.t1"></p></div>
      <ol class="det__ablauf" data-stagger>
        <li><b data-i18n="det.s1"></b><span data-i18n="det.s1d"></span></li>
        <li><b data-i18n="det.s2"></b><span data-i18n="det.s2d"></span></li>
        <li><b data-i18n="det.s3"></b><span data-i18n="det.s3d"></span></li>
        <li><b data-i18n="det.s4"></b><span data-i18n="det.s4d"></span></li>
      </ol>
      <a class="btn btn--primary det__cta" href="index.html?paket=starter#contact" data-i18n="det.cta"></a>
  </section>

  <section class="det" id="business">
    <div class="det__head">
      <span class="det__no">02</span>

  <section class="det" id="premium">
    <div class="det__head">
      <span class="det__no">03</span>
      <div>

name: FTP-Verzeichnis ermitteln
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Verzeichnisse auflisten
        env:
          PW: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ssl:verify-certificate no; set ftp:ssl-force true;
            set ftp:ssl-protect-data true; set ftp:passive-mode true;
            open -u 'f018ae3f,$PW' w021fb9a.kasserver.com;
            echo '===WURZEL==='; cls -1;
            echo '===VECOM==='; cls -1 /vecom-design.it;
            bye" || true

# Veröffentlicht die Seite bei jedem Push auf main per FTP auf den Webspace
# von All-Inkl (kasserver.com) — damit läuft vecom-design.it auf dem bezahlten
# Hosting, und E-Mail sowie DNS bleiben unangetastet.
#
# EINMALIG EINZURICHTEN (im Browser, dauert zwei Minuten):
#   1. GitHub → Repository → Settings → Secrets and variables → Actions
#      → "New repository secret"
#         Name:  FTP_PASSWORD
#         Wert:  das FTP-Passwort aus dem KAS
#      Das Passwort gehört ausschließlich hierher — nie in eine Datei,
#      nie in einen Chat, nie in einen Commit.
#   2. Ebenda unter "Variables" → "New repository variable"
#         Name:  FTP_SERVER_DIR
#         Wert:  das Zielverzeichnis der Domain im KAS,
#                z. B. /vecom-design.it/  (mit Schrägstrich am Ende)
#      Steht im KAS unter "Domain" in der Spalte Verzeichnis.
#
# Ohne diese beiden Angaben bricht der Ablauf sauber ab und meldet, was fehlt.

name: Deploy per FTP (All-Inkl)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ohne_pruefung:
        description: "Ohne Kettenprüfung ausliefern (nur im Notfall)"
        type: boolean
        default: false

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # ERST PRUEFEN, DANN AUSLIEFERN
  #
  # Die Kette wird einmal ganz durchgespielt, bevor irgendetwas auf den Server
  # geht: Bestellung, Zahlung, Projekt, Fragebogen, beide Freigabeschalter,
  # Restzahlung, online, abgeschlossen. Reisst eine der Pruefungen, findet der
  # Upload nicht statt.
  #
  # Der Notausgang oben ist Absicht und bewusst unbequem: Er geht nur von
  # Hand, heisst so, wie er ist, und steht danach im Protokoll. Ein Deploy an
  # der Pruefung vorbei soll eine Entscheidung sein, kein Versehen.
  # ==========================================================================
  kette:
    if: github.event_name != 'workflow_dispatch' || !inputs.ohne_pruefung
    uses: ./.github/workflows/kette.yml

  deploy:
    needs: [kette]
    if: always() && (needs.kette.result == 'success' || needs.kette.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sprachseiten /de/ und /en/ aus index.html + i18n-data.js neu erzeugen
      - name: Sprachseiten bauen
        run: node build.mjs

      - name: Zugangsdaten prüfen
        id: check
        env:
          PW: ${{ secrets.FTP_PASSWORD }}
          DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          if [ -z "$PW" ]; then
            echo "::warning::FTP_PASSWORD fehlt — siehe Kopf dieser Datei. Kein Upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$DIR" ]; then
            echo "::warning::Variable FTP_SERVER_DIR fehlt — Zielverzeichnis der Domain eintragen. Kein Upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Übertragung mit lftp statt mit einer fertigen Action: Der Webspace von
      # All-Inkl bricht bei verschlüsselten Datenverbindungen sonst die
      # Verbindung ab (ECONNRESET). lftp behandelt passive Verbindungen
      # nachsichtiger und überträgt nur Geändertes.
      - name: Auf den Webspace hochladen
        if: steps.check.outputs.ok == 'true'
        env:
          PW: ${{ secrets.FTP_PASSWORD }}
          DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # DIE ABRISSLISTE
          #
          # mirror --reverse laedt hoch und loescht nie. Wer eine Datei aus dem
          # Repository nimmt, nimmt sie damit nicht vom Webspace — sie bleibt
          # liegen, wird weiter ausgeliefert und faellt niemandem auf.
          # Gemessen am 12.09.2026: zwoelf solcher Leichen, zusammen gut 2 MB,
          # darunter ein Film von 1,16 MB, den die Seite seit Wochen nicht mehr
          # abspielt, und pakete.html mit drei Preisen, die es nicht mehr gibt.
          #
          # Deshalb die Liste unter dem mirror: Was dort steht, wird bei jedem
          # Deploy entfernt. Der Befehl schweigt, wenn die Datei schon weg ist —
          # die Liste darf also stehen bleiben und kostet nichts. Wer kuenftig
          # eine Datei aus dem Repository nimmt, traegt sie dort ein; das ist
          # der einzige Weg, auf dem sie wirklich verschwindet.
          #
          # Keine .md-Datei geht auf den Webspace. Frueher standen hier drei
          # Namen einzeln; VECOM-STANDARD.md waere darum hochgeladen worden.
          # Die .htaccess sperrt .md ohnehin fuer Besucher — was gesperrt ist,
          # muss gar nicht erst oben liegen. Eine Endung statt einer Liste,
          # die bei jeder neuen Notizdatei vergessen wird.
          # cockpit/.htaccess liegt nicht mehr im Repository (siehe
          # cockpit/LIESMICH.md). Der Ausschluss unten ist nur die zweite
          # Sicherung — verlassen wird sich darauf nicht: am 30.08.2026 wurde
          # genau diese Zeile von einem parallelen Commit entfernt, und der
          # naechste Deploy hat den Passwortschutz still ueberschrieben.
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 3;
            set mirror:parallel-transfer-count 3;
            open -u 'f018ae3f,$PW' w021fb9a.kasserver.com;
            rm -rf $DIR.git;
            mirror --reverse --continue --verbose=1 \
              --exclude '^\.git' \
              --exclude '^\.github/' \
              --exclude '^node_modules/' \
              --exclude '^caps/' \
              --exclude '^tools/' \
              --exclude '^cockpit/\.htaccess$' \
              --exclude '^build\.mjs$' \
              --exclude '^app/pruefung/kette\.php$' \
              --exclude '\.md$' \
              ./ $DIR;
            rm -f $DIR/video/auftakt.mp4;
            rm -f $DIR/video/auftakt.webm;
            rm -f $DIR/assets/css/theme.css;
            rm -f $DIR/assets/img/auftakt-poster.webp;
            rm -f $DIR/assets/img/jonika.png;
            rm -f $DIR/assets/img/logo-full-dark.png;
            rm -f $DIR/assets/img/logo-mark.png;
            rm -f $DIR/assets/img/trendonix.png;
            rm -f $DIR/assets/js/legal-i18n.js;
            rm -f $DIR/assets/js/world-i18n.js;
            rm -f $DIR/assets/js/thema.js;
            rm -f $DIR/assets/js/i18n-data.js;
            rm -f $DIR/pakete.html;
            bye"

      - name: Cockpit-Schutz nachsehen
        if: steps.check.outputs.ok == 'true'
        run: |
          sleep 5
          C=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 https://vecom-design.it/cockpit/ || echo 000)
          if [ "$C" = "401" ]; then
            echo "Cockpit ist passwortgeschuetzt (401)."
          else
            echo "::warning::Cockpit antwortet $C statt 401 — der Passwortschutz ist NICHT aktiv. Im KAS unter Verzeichnisschutz fuer /cockpit/ einschalten."
          fi

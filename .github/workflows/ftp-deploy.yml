# Veröffentlicht die Seite bei jedem Push auf main per FTP auf den Webspace
# von All-Inkl (kasserver.com) — damit läuft vecom-design.it auf dem bezahlten
# Hosting, und E-Mail sowie DNS bleiben unangetastet.
#
# EINMALIG EINZURICHTEN (im Browser, dauert zwei Minuten):
#   1. GitHub → Repository → Settings → Secrets and variables → Actions
#      → "New repository secret"
#         Name:  FTP_PASSWORD
#         Wert:  das FTP-Passwort aus dem KAS
#      Das Passwort gehört ausschließlich hierher — nie in eine Datei,
#      nie in einen Chat, nie in einen Commit.
#   2. Ebenda unter "Variables" → "New repository variable"
#         Name:  FTP_SERVER_DIR
#         Wert:  das Zielverzeichnis der Domain im KAS,
#                z. B. /vecom-design.it/  (mit Schrägstrich am Ende)
#      Steht im KAS unter "Domain" in der Spalte Verzeichnis.
#
# Ohne diese beiden Angaben bricht der Ablauf sauber ab und meldet, was fehlt.

name: Deploy per FTP (All-Inkl)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sprachseiten /de/ und /en/ aus index.html + i18n-data.js neu erzeugen
      - name: Sprachseiten bauen
        run: node build.mjs

      - name: Zugangsdaten prüfen
        id: check
        env:
          PW: ${{ secrets.FTP_PASSWORD }}
          DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          if [ -z "$PW" ]; then
            echo "::warning::FTP_PASSWORD fehlt — siehe Kopf dieser Datei. Kein Upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$DIR" ]; then
            echo "::warning::Variable FTP_SERVER_DIR fehlt — Zielverzeichnis der Domain eintragen. Kein Upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Übertragung mit lftp statt mit einer fertigen Action: Der Webspace von
      # All-Inkl bricht bei verschlüsselten Datenverbindungen sonst die
      # Verbindung ab (ECONNRESET). lftp behandelt passive Verbindungen
      # nachsichtiger und überträgt nur Geändertes.
      - name: Auf den Webspace hochladen
        if: steps.check.outputs.ok == 'true'
        env:
          PW: ${{ secrets.FTP_PASSWORD }}
          DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 3;
            set mirror:parallel-transfer-count 3;
            open -u 'f018ae3f,$PW' w021fb9a.kasserver.com;
            rm -rf $DIR.git;
            mirror --reverse --continue --verbose=1 \
              --exclude '^\.git' \
              --exclude '^\.github/' \
              --exclude '^node_modules/' \
              --exclude '^caps/' \
              --exclude '^tools/' \
              --exclude '^build\.mjs$' \
              --exclude '^README\.md$' \
              ./ $DIR;
            bye"
